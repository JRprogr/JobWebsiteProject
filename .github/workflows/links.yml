name: company links

# Refreshes the subcontract links on the Market Insight page from USAspending.gov (public US federal award data, no key) and
# re-syncs the hand-curated links in db/seed/links.json. Run it by hand now and then; the data changes slowly.
on:
  workflow_dispatch:
    inputs:
      source:
        description: "Which source to import"
        type: choice
        options: [all, curated, usaspending, ted]
        default: all
      slugs:
        description: "USAspending only: just these companies, space separated (the retry after a partial run)"
        required: false
        default: ""

concurrency:
  group: company-links
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --omit=dev
      - name: Import links
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NODE_OPTIONS: --disable-warning=MODULE_TYPELESS_PACKAGE_JSON
          SOURCE: ${{ inputs.source }}
          SLUGS: ${{ inputs.slugs }}
        run: node scripts/links.mts ${SOURCE:-all} $SLUGS
